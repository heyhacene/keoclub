name: Compiler APK Android KeoClub

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release KeoClub APK
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configuration de Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Configuration du SDK Android
        uses: android-actions/setup-android@v4

      - name: Installation des dépendances
        run: npm install

      - name: Construction de l'application Web (Next.js export)
        run: npm run build
        env:
          NEXT_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}

      - name: Initialisation du projet Android Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Génération des icônes Android depuis le logo SVG
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          # Icônes classiques et rondes
          rsvg-convert -w 48 -h 48 public/icon.svg -o android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          rsvg-convert -w 48 -h 48 public/icon.svg -o android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          rsvg-convert -w 72 -h 72 public/icon.svg -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          rsvg-convert -w 72 -h 72 public/icon.svg -o android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          rsvg-convert -w 96 -h 96 public/icon.svg -o android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          rsvg-convert -w 96 -h 96 public/icon.svg -o android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          rsvg-convert -w 144 -h 144 public/icon.svg -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          rsvg-convert -w 144 -h 144 public/icon.svg -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          rsvg-convert -w 192 -h 192 public/icon.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          rsvg-convert -w 192 -h 192 public/icon.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          # Icônes adaptatives Android 8+ (Foreground)
          rsvg-convert -w 108 -h 108 public/icon.svg -o android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          rsvg-convert -w 162 -h 162 public/icon.svg -o android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          rsvg-convert -w 216 -h 216 public/icon.svg -o android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          rsvg-convert -w 324 -h 324 public/icon.svg -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          rsvg-convert -w 432 -h 432 public/icon.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

          # Couleur de fond adaptative (#06070b)
          if [ -f "android/app/src/main/res/values/ic_launcher_background.xml" ]; then
            sed -i 's/#FFFFFF/#06070b/gi' android/app/src/main/res/values/ic_launcher_background.xml
          fi

      - name: Synchronisation Capacitor Android
        run: npx cap sync android

      - name: Injection du coffre-fort natif Android synchrone (AndroidNativeStorage)
        run: |
          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          echo "Injection de AndroidNativeStorage dans $MAIN_ACT..."
          cat << 'EOF' > "$MAIN_ACT"
          package fr.otsmane.keoclub;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private static final String PREFS_NAME = "KeoClubPermanentVault";

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  attachNativeVault();
              }

              @Override
              protected void load() {
                  super.load();
                  attachNativeVault();
              }

              private void attachNativeVault() {
                  try {
                      if (this.bridge != null && this.bridge.getWebView() != null) {
                          WebView webView = this.bridge.getWebView();
                          WebSettings settings = webView.getSettings();
                          settings.setDomStorageEnabled(true);
                          settings.setDatabaseEnabled(true);
                          webView.addJavascriptInterface(new AndroidNativeStorage(this), "AndroidNativeStorage");
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              public static class AndroidNativeStorage {
                  private final Context context;

                  public AndroidNativeStorage(Context context) {
                      this.context = context.getApplicationContext();
                  }

                  @JavascriptInterface
                  public String getItem(String key) {
                      if (key == null) return null;
                      SharedPreferences prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                      return prefs.getString(key, null);
                  }

                  @JavascriptInterface
                  public boolean setItem(String key, String value) {
                      if (key == null) return false;
                      SharedPreferences prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                      return prefs.edit().putString(key, value).commit();
                  }

                  @JavascriptInterface
                  public boolean removeItem(String key) {
                      if (key == null) return false;
                      SharedPreferences prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                      return prefs.edit().remove(key).commit();
                  }
              }
          }
          EOF

      - name: Configuration des permissions Android (Caméra & Galerie Photos)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            echo "Ajout des permissions Caméra et Galerie dans AndroidManifest.xml..."
            if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
              sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' "$MANIFEST"
            fi
          fi

      - name: Configuration de la version Android (versionCode & versionName)
        run: |
          sed -i 's/versionCode 1/versionCode ${{ github.run_number }}/g' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.${{ github.run_number }}"/g' android/app/build.gradle

      - name: Compilation et Signature de l'APK Android
        working-directory: android
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          echo "🚀 Compilation Release avec Gradle..."
          ./gradlew assembleRelease --stacktrace

          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "APK généré : $UNSIGNED_APK"

          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools $ANDROID_HOME/build-tools /usr/local/lib/android/sdk/build-tools -name apksigner 2>/dev/null | sort -V | tail -n 1)
          ZIPALIGN=$(find $ANDROID_SDK_ROOT/build-tools $ANDROID_HOME/build-tools /usr/local/lib/android/sdk/build-tools -name zipalign 2>/dev/null | sort -V | tail -n 1)

          if [ -n "$ZIPALIGN" ] && ! $ZIPALIGN -c 4 "$UNSIGNED_APK"; then
            echo "Alignement 4-byte de l'APK..."
            $ZIPALIGN -p -f 4 "$UNSIGNED_APK" aligned.apk
            UNSIGNED_APK="aligned.apk"
          fi

          KEYSTORE_PATH="../keystore/keoclub.keystore"
          if [ -n "$SIGNING_KEY" ]; then
            echo "🔑 Signature avec le secret de dépôt GitHub..."
            echo "$SIGNING_KEY" | base64 -d > release.keystore
            KEYSTORE_FILE="release.keystore"
            KEY_ALIAS="$ALIAS"
            STORE_PASS="$KEY_STORE_PASSWORD"
            KEY_PASS="${KEY_PASSWORD:-$KEY_STORE_PASSWORD}"
          elif [ -f "$KEYSTORE_PATH" ]; then
            echo "🔑 Réutilisation du trousseau officiel permanent KeoClub..."
            KEYSTORE_FILE="$KEYSTORE_PATH"
            KEY_ALIAS="keonote"
            STORE_PASS="keonotepassword"
            KEY_PASS="keonotepassword"
          else
            echo "🔑 Génération initiale du trousseau officiel permanent KeoClub..."
            mkdir -p ../keystore
            keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -alias keonote -keyalg RSA -keysize 2048 -validity 10000 -storepass keonotepassword -keypass keonotepassword -dname "CN=KeoClub, OU=Apps, O=Otsmane, L=Paris, S=France, C=FR"
            KEYSTORE_FILE="$KEYSTORE_PATH"
            KEY_ALIAS="keonote"
            STORE_PASS="keonotepassword"
            KEY_PASS="keonotepassword"

            echo "📦 Enregistrement du trousseau permanent dans le dépôt GitHub..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$KEYSTORE_PATH"
            git commit -m "chore: persist KeoClub signing keystore [skip ci]" || true
            git push origin main || true
          fi

          echo "✍️ Signature cryptographique apksigner..."
          $APKSIGNER sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out ../KeoClub.apk \
            "$UNSIGNED_APK"

          echo "🛡️ Validation de l'APK signé :"
          $APKSIGNER verify --verbose ../KeoClub.apk
          rm -f release.keystore aligned.apk
          cp ../KeoClub.apk "../KeoClub-Build-${{ github.run_number }}.apk"

      - name: Publication de l'APK en téléchargement (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: keoclub-android-apk
          path: |
            KeoClub.apk
            KeoClub-Build-${{ github.run_number }}.apk
          retention-days: 30

      - name: Création / Mise à jour de la Release GitHub avec l'APK direct
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0-build.${{ github.run_number }}
          name: KeoClub v1.0.0 (Build ${{ github.run_number }})
          body: |
            ## 🚀 KeoClub v1.0.0 — Build ${{ github.run_number }}

            ### ✨ Nouveautés de cette version :
            - **Réseau social de partage culturel & Drops** : échangez des recommandations de films, séries, musique, livres et podcasts avec vos amis.
            - **Boîte de Drops** : recevez les pépites de vos amis avec leurs mots personnalisés et ajoutez-les à votre liste en 1 clic.
            - **Moteur de recherche multi-médias 5 univers** : TMDB (cinéma/séries), iTunes (musique + podcasts), Google Books (livres).
            - **Lecteur audio intégré** : écoutez des extraits musicaux 30s et podcasts directement dans l'application.
            - **Gestion de Ma Liste** : suivez vos œuvres par statut (*À découvrir*, *En cours*, *Terminé*, *Coup de cœur*).

            ### 📲 Téléchargement direct :
            - [**Télécharger KeoClub-Build-${{ github.run_number }}.apk**](https://github.com/heyhacene/keoclub/releases/download/v1.0.0-build.${{ github.run_number }}/KeoClub-Build-${{ github.run_number }}.apk)
          files: |
            KeoClub.apk
            KeoClub-Build-${{ github.run_number }}.apk
          draft: false
          prerelease: false
