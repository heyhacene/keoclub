<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="50%" stop-color="#14142b" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Neon Drop Gradient -->
    <linearGradient id="drop-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="85%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glowing Core Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <linearGradient id="accent-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Background Base (Squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Subtle Outer Border Glow -->
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#6366f1" stroke-width="3" stroke-opacity="0.35" />

  <!-- Cultural Circle Waves -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Glowing Aura behind Drop -->
  <path d="M 256,100 C 256,100 370,250 370,330 C 370,396 319,430 256,430 C 193,430 142,396 142,330 C 142,250 256,100 256,100 Z" 
        fill="url(#drop-grad)" opacity="0.3" filter="url(#glow)" />

  <!-- Main Drop Silhouette -->
  <path d="M 256,108 C 256,108 360,246 360,324 C 360,382 313,418 256,418 C 199,418 152,382 152,324 C 152,246 256,108 256,108 Z" 
        fill="url(#drop-grad)" />

  <!-- Monogram "K" Inside the Drop -->
  <!-- Left Vertical Stem of K -->
  <rect x="206" y="220" width="22" height="130" rx="11" fill="#ffffff" />
  
  <!-- Upper Diagonal of K (Shooting Star / Play Arrow Angle) -->
  <path d="M 226,275 L 285,224 C 291,219 299,223 299,230 L 299,238 C 299,242 297,247 293,250 L 244,290 L 226,275 Z" fill="#ffffff" />

  <!-- Lower Diagonal of K -->
  <path d="M 235,282 L 292,342 C 297,347 296,354 290,354 L 280,354 C 275,354 271,351 268,347 L 224,298 L 235,282 Z" fill="#ffffff" />

  <!-- Cultural Sparkle Star (Top Right of Drop) -->
  <path d="M 334,170 Q 334,188 348,188 Q 334,188 334,206 Q 334,188 320,188 Q 334,188 334,170 Z" fill="url(#accent-gold)" />
  <circle cx="334" cy="188" r="3" fill="#ffffff" />

  <!-- Mini Sparkle (Bottom Left) -->
  <circle cx="178" cy="336" r="4" fill="#22d3ee" />
</svg>
